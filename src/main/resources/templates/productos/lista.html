<html th:replace="~{fragments/layout :: pagina('Productos', ~{::contenido})}" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="contenido">
    <div class="cabecera-vista">
        <h2>Productos</h2>
        <div>
            <a class="btn" th:if="${sesion.puede('productos','categorias')}" th:href="@{/productos/categorias}">Categorías</a>
            <a class="btn" th:if="${sesion.puede('productos','crear')}" th:href="@{/productos/importar}">Importar desde Excel</a>
            <a class="btn btn-primario" th:if="${sesion.puede('productos','crear')}" th:href="@{/productos/nuevo}">Nuevo producto</a>
        </div>
    </div>
    <form class="tarjeta filtros" method="get" th:action="@{/productos}">
        <label class="filtro-buscar">Buscar <input type="text" name="texto" th:value="${texto}" placeholder="Nombre o código"></label>
        <label>Categoría
            <select name="categoria"><option value="">Todas</option>
                <option th:each="c : ${categorias}" th:value="${c.idCategoria}" th:text="${c.nombre}" th:selected="${c.idCategoria == categoria}"></option></select>
        </label>
        <label>Marca
            <select name="marca"><option value="">Todas</option>
                <option th:each="m : ${marcas}" th:value="${m}" th:text="${m}" th:selected="${m == marca}"></option></select>
        </label>
        <label>Estado
            <select name="estado"><option value="">Todos</option>
                <option value="activo" th:selected="${estado == 'activo'}">Activos</option>
                <option value="inactivo" th:selected="${estado == 'inactivo'}">Inactivos</option></select>
        </label>
        <label>Inventario
            <select name="inventario"><option value="">Todos</option>
                <option value="DISPONIBLE" th:selected="${inventario == 'DISPONIBLE'}">Disponible</option>
                <option value="STOCK_BAJO" th:selected="${inventario == 'STOCK_BAJO'}">Stock bajo</option>
                <option value="SIN_STOCK" th:selected="${inventario == 'SIN_STOCK'}">Sin stock</option>
                <option value="CRITICO" th:selected="${inventario == 'CRITICO'}">Stock crítico (bajo + sin stock)</option></select>
        </label>
        <button class="btn" type="submit">Filtrar</button>
    </form>
    <div class="tarjeta tabla-scroll">
        <p class="conteo" th:text="${productos.size()} + ' producto(s) - el stock mostrado es de la sede actual'"></p>
        <table>
            <thead><tr><th>Código</th><th>Producto</th><th>Categoría</th><th>Marca</th><th>Presentación</th><th>P. compra</th><th>P. venta</th>
                <th>Stock</th><th>Mínimo</th><th>Inventario</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody>
            <tr th:each="p : ${productos}" th:classappend="${!p.activo} ? 'fila-inactiva'">
                <td class="texto-suave" th:text="${p.codigoBarras}"></td>
                <td><strong th:text="${p.nombre}"></strong></td>
                <td th:text="${p.categoriaNombre}"></td>
                <td th:text="${p.marca} ?: '-'"></td>
                <td class="texto-suave"><span th:text="${p.presentacion} ?: ${p.unidad}"></span><br>
                    <span th:if="${p.empaque != 'Unidad'}" th:text="${p.empaque} + ' x ' + ${p.unidadesPorEmpaque}"></span></td>
                <td class="sin-salto" th:text="${@fmt.soles(p.precioCompra)}"></td>
                <td class="sin-salto" th:text="${@fmt.soles(p.precioVenta)}"></td>
                <td><strong th:text="${p.stock}"></strong></td>
                <td th:text="${p.stockMinimo}"></td>
                <td><span class="badge" th:classappend="${p.estadoStock.color}" th:text="${p.estadoStock.texto}"></span></td>
                <td><span class="badge" th:classappend="${p.activo} ? 'gris' : 'roja'" th:text="${p.activo} ? 'ACTIVO' : 'INACTIVO'"></span></td>
                <td class="celda-acciones">
                    <a class="btn btn-mini" th:href="@{/productos/{id}(id=${p.idProducto})}">Ver</a>
                    <th:block th:if="${sesion.puede('productos','editar')}">
                        <a class="btn btn-mini" th:href="@{/productos/{id}/editar(id=${p.idProducto})}">Editar</a>
                        <form th:action="@{/productos/{id}/estado(id=${p.idProducto})}" method="post">
                            <button class="btn btn-mini" type="submit" th:text="${p.activo} ? 'Desactivar' : 'Activar'"></button>
                        </form>
                    </th:block>
                    <form th:if="${sesion.puede('productos','eliminar')}" th:action="@{/productos/{id}/eliminar(id=${p.idProducto})}" method="post"
                          data-confirmar="¿Eliminar el producto? Si tiene lotes o ventas se desactivará en su lugar.">
                        <button class="btn btn-mini btn-peligro-suave" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="texto-suave centrado" th:if="${productos.isEmpty()}">No hay productos con esos filtros.</p>
    </div>
</section>
</body>
</html>
